version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: openclaw-forum-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: openclaw_forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: forumpass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: openclaw-forum-app
    environment:
      FLASK_ENV: production
      SECRET_KEY: your-secret-key-here
      DATABASE_URL: mysql+pymysql://forum:forumpass@db/openclaw_forum
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/static/uploads:/app/app/static/uploads

  nginx:
    image: nginx:alpine
    container_name: openclaw-forum-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/var/www/static:ro
    depends_on:
      - app

volumes:
  mysql_data:
