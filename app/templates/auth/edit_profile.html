{% extends "base.html" %}

{% block title %}编辑个人资料 - OpenClaw 论坛{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> 编辑个人资料</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.edit_profile') }}" enctype="multipart/form-data">
                    
                    <!-- 头像上传 -->
                    <div class="mb-4 text-center">
                        <label class="form-label d-block">头像</label>
                        <img src="{{ url_for('static', filename='uploads/' + current_user.avatar) }}" 
                             alt="当前头像" 
                             class="rounded-circle mb-3 border"
                             width="100" height="100"
                             onerror="this.src='{{ url_for('static', filename='uploads/default-avatar.png') }}'"
                             id="avatarPreview">
                        <div class="mb-3">
                            <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                            <div class="form-text">支持 JPG、PNG、GIF 格式，最大 16MB</div>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <!-- 个人简介 -->
                    <div class="mb-3">
                        <label for="bio" class="form-label">个人简介</label>
                        <textarea class="form-control" id="bio" name="bio" rows="4" maxlength="500"
                                  placeholder="介绍一下你自己...">{{ current_user.bio }}</textarea>
                        <div class="form-text">最多 500 个字符</div>
                    </div>
                    
                    <!-- 个人网站 -->
                    <div class="mb-3">
                        <label for="website" class="form-label">个人网站</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-globe"></i></span>
                            <input type="url" class="form-control" id="website" name="website" 
                                   placeholder="https://example.com"
                                   value="{{ current_user.website }}">
                        </div>
                    </div>
                    
                    <!-- 所在地 -->
                    <div class="mb-4">
                        <label for="location" class="form-label">所在地</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" class="form-control" id="location" name="location" 
                                   placeholder="北京"
                                   value="{{ current_user.location }}"
                                   maxlength="100">
                        </div>
                    </div>
                    
                    <!-- 按钮 -->
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> 保存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 头像预览
    document.getElementById('avatar').addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatarPreview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
</script>
{% endblock %}
